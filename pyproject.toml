[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "writing-agent"
version = "0.1.0"
description = "Local writing agent for an Obsidian-style novel vault."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.scripts]
writing-agent = "writing_agent:main"
writing_agent = "writing_agent:main"
